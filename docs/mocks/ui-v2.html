<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cairo Metro: UI v2 mocks (static, not the real app)</title>
    <style>
      :root {
        --bg: #eef1f6;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --accent: #0f766e;
        --on: #ffffff;
        --chip: #f1f5f9;
        --map: #e6edf5;
        --map-road: #d4dde9;
        --glass: rgb(255 255 255 / 0.75);
        --shadow: 0 8px 28px rgb(15 23 42 / 0.16);
        --l1: #2563eb;
        --l2: #dc2626;
        --l3: #16a34a;
        --hl: #f59e0b;
      }
      [data-theme='dark'] {
        --bg: #0b0f17;
        --card: #141a26;
        --text: #e8edf5;
        --muted: #94a3b8;
        --border: #243044;
        --accent: #2dd4bf;
        --on: #06201c;
        --chip: #1b2434;
        --map: #0f1b2e;
        --map-road: #172742;
        --glass: rgb(20 26 38 / 0.72);
        --shadow: 0 8px 28px rgb(0 0 0 / 0.5);
        --l1: #60a5fa;
        --l2: #f87171;
        --l3: #4ade80;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.4 system-ui,
          'Segoe UI',
          Tahoma,
          sans-serif;
        transition:
          background 0.3s,
          color 0.3s;
      }
      header.page {
        padding: 20px 24px 4px;
      }
      header.page h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      header.page p {
        margin: 0;
        color: var(--muted);
        max-width: 75ch;
      }
      .bar {
        padding: 12px 24px;
        display: flex;
        gap: 10px 18px;
        flex-wrap: wrap;
        align-items: center;
      }
      .seg {
        display: inline-flex;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 3px;
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        padding: 5px 12px;
        border-radius: 999px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .seg button.on {
        background: var(--accent);
        color: var(--on);
      }
      .bar label {
        font-size: 13px;
        color: var(--muted);
      }
      .sw {
        display: inline-flex;
        gap: 6px;
        vertical-align: middle;
      }
      .sw button {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid var(--card);
        outline: 1px solid var(--border);
        cursor: pointer;
      }
      .sw button.on {
        outline: 2px solid var(--text);
      }
      .row {
        display: flex;
        gap: 28px;
        padding: 8px 24px 40px;
        flex-wrap: wrap;
        align-items: flex-start;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin: 10px 4px 0;
        max-width: 330px;
        color: var(--muted);
        font-size: 13px;
      }
      figcaption b {
        color: var(--text);
      }
      .phone {
        width: 330px;
        height: 660px;
        border-radius: 32px;
        border: 8px solid #0f172a;
        background: var(--bg);
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      svg.ico {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .mapbox {
        position: absolute;
        inset: 0;
        background: var(--map);
      }
      .mapbox svg.map {
        width: 100%;
        height: 100%;
      }
      .map .road {
        stroke: var(--map-road);
        fill: none;
        stroke-linecap: round;
      }
      .map .river {
        fill: none;
        stroke: color-mix(in srgb, var(--l1) 22%, var(--map));
        stroke-width: 22;
        stroke-linecap: round;
        opacity: 0.55;
      }
      .map .ln {
        fill: none;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: opacity 0.3s;
      }
      .map.hasroute .ln {
        opacity: 0.28;
      }
      .map .halo {
        fill: none;
        stroke: var(--hl);
        stroke-width: 18;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.7;
        filter: blur(0.5px);
      }
      .map .case {
        fill: none;
        stroke: var(--card);
        stroke-width: 11;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .map .rt {
        fill: none;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .map .flow {
        fill: none;
        stroke: #fff;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 1 11;
        animation: flow 1.2s linear infinite;
        opacity: 0.9;
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -12;
        }
      }
      .map circle.st {
        fill: var(--card);
        stroke-width: 3;
      }
      .map circle.ix {
        fill: var(--card);
        stroke: var(--text);
        stroke-width: 3;
      }
      .map.hasroute .dim {
        opacity: 0.35;
      }
      .map text {
        font:
          600 10px system-ui,
          'Segoe UI',
          sans-serif;
        fill: var(--text);
        paint-order: stroke;
        stroke: var(--map);
        stroke-width: 3.5px;
        stroke-linejoin: round;
      }
      .map text.k {
        font-size: 11px;
        font-weight: 800;
      }
      .map .pin {
        fill: var(--hl);
        stroke: #fff;
        stroke-width: 2;
      }
      .fab {
        position: absolute;
        right: 12px;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--glass);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
        box-shadow: var(--shadow);
        color: var(--text);
      }
      .topcard {
        position: absolute;
        left: 12px;
        right: 12px;
        top: 12px;
        background: var(--glass);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 10px 12px;
        box-shadow: var(--shadow);
        display: grid;
        gap: 6px;
        z-index: 3;
      }
      .ep {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }
      .ep i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        flex: none;
      }
      .ep.to i {
        background: var(--l2);
      }
      .ep small {
        color: var(--muted);
      }
      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 560px;
        background: var(--card);
        border-radius: 24px 24px 0 0;
        box-shadow: 0 -10px 34px rgb(0 0 0 / 0.22);
        transform: translateY(var(--y, 330px));
        transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
        z-index: 4;
        display: flex;
        flex-direction: column;
      }
      .sheet[data-s='peek'] {
        --y: 440px;
      }
      .sheet[data-s='half'] {
        --y: 270px;
      }
      .sheet[data-s='full'] {
        --y: 70px;
      }
      .grab {
        border: 0;
        background: transparent;
        padding: 10px 0 6px;
        display: grid;
        place-items: center;
        cursor: pointer;
        width: 100%;
      }
      .grab i {
        width: 40px;
        height: 5px;
        border-radius: 3px;
        background: var(--border);
      }
      .sbody {
        padding: 0 14px 16px;
        overflow: auto;
        flex: 1;
      }
      .sum {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .big {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .meta {
        color: var(--muted);
        font-size: 13px;
        margin: 2px 0 10px;
      }
      .tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .tag {
        font-size: 12px;
        padding: 3px 9px;
        border-radius: 999px;
        background: var(--chip);
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .tag.ok {
        color: var(--accent);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #fff;
        font-weight: 700;
        font-size: 12px;
        border-radius: 999px;
        padding: 2px 9px 2px 3px;
      }
      .pill b {
        background: #fff;
        color: #0f172a;
        border-radius: 999px;
        padding: 0 6px;
        font-size: 11px;
      }
      .tl {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        position: relative;
      }
      .tl li {
        position: relative;
        padding: 0 0 14px 30px;
        opacity: 0;
        transform: translateY(8px);
        animation: rise 0.45s forwards;
      }
      .tl li:nth-child(2) {
        animation-delay: 0.08s;
      }
      .tl li:nth-child(3) {
        animation-delay: 0.16s;
      }
      .tl li:nth-child(4) {
        animation-delay: 0.24s;
      }
      .tl li:nth-child(5) {
        animation-delay: 0.32s;
      }
      @keyframes rise {
        to {
          opacity: 1;
          transform: none;
        }
      }
      .tl li::before {
        content: '';
        position: absolute;
        left: 8px;
        top: 14px;
        bottom: -2px;
        width: 5px;
        border-radius: 3px;
        background: var(--c, var(--border));
      }
      .tl li:last-child::before {
        display: none;
      }
      .tl li::after {
        content: '';
        position: absolute;
        left: 4px;
        top: 4px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--card);
        border: 3px solid var(--c, var(--border));
      }
      .tl li.walk::before {
        background: repeating-linear-gradient(var(--muted) 0 4px, transparent 4px 8px);
        width: 3px;
        left: 9px;
      }
      .tl b {
        display: block;
      }
      .tl small {
        color: var(--muted);
      }
      .tl details summary {
        cursor: pointer;
        color: var(--accent);
        font-size: 13px;
        margin-top: 2px;
      }
      .tl details ul {
        margin: 4px 0 0;
        padding-inline-start: 16px;
        color: var(--muted);
        font-size: 13px;
        animation: rise 0.3s;
      }
      .cta {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      .btn {
        flex: 1;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        border-radius: 14px;
        padding: 10px;
        font: inherit;
        font-weight: 600;
        display: flex;
        justify-content: center;
        gap: 6px;
        align-items: center;
        cursor: pointer;
      }
      .btn.p {
        background: var(--accent);
        color: var(--on);
        border-color: var(--accent);
      }
      .appbar {
        padding: 12px 14px 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--glass);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
      }
      .appbar strong {
        font-size: 16px;
      }
      .body {
        padding: 12px 14px;
        overflow: auto;
        flex: 1;
      }
      .field {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 12px;
        margin-bottom: 10px;
        color: var(--muted);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.04);
      }
      .field.on {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
        color: var(--text);
      }
      .chips {
        display: flex;
        gap: 6px;
        overflow: auto;
        padding: 0 0 10px;
      }
      .chip {
        white-space: nowrap;
        font-size: 13px;
        padding: 5px 11px;
        border-radius: 999px;
        background: var(--chip);
        border: 1px solid var(--border);
      }
      .chip.on {
        background: var(--accent);
        color: var(--on);
        border-color: var(--accent);
      }
      .group h4 {
        margin: 10px 2px 6px;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .item {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 9px 11px;
        margin-bottom: 6px;
        opacity: 0;
        animation: rise 0.4s forwards;
      }
      .item:nth-of-type(2) {
        animation-delay: 0.07s;
      }
      .item:nth-of-type(3) {
        animation-delay: 0.14s;
      }
      .item:nth-of-type(4) {
        animation-delay: 0.21s;
      }
      .ic {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        color: #fff;
        flex: none;
      }
      .item .t {
        flex: 1;
        min-width: 0;
      }
      .item .t b {
        display: block;
      }
      .item .t small {
        color: var(--muted);
      }
      .skel {
        height: 52px;
        border-radius: 14px;
        margin-bottom: 6px;
        background: linear-gradient(90deg, var(--chip) 25%, var(--border) 50%, var(--chip) 75%);
        background-size: 200% 100%;
        animation: sh 1.2s infinite;
      }
      @keyframes sh {
        to {
          background-position: -200% 0;
        }
      }
      .tabs {
        display: flex;
        background: var(--glass);
        backdrop-filter: blur(12px);
        border-top: 1px solid var(--border);
        position: relative;
        z-index: 6;
      }
      .tabs div {
        flex: 1;
        display: grid;
        justify-items: center;
        gap: 2px;
        padding: 8px 0 10px;
        font-size: 11px;
        color: var(--muted);
      }
      .tabs div.on {
        color: var(--accent);
        font-weight: 700;
      }
      .tabs div.on svg {
        animation: pop 0.35s;
      }
      @keyframes pop {
        40% {
          transform: scale(1.25);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
        .item,
        .tl li {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-train" viewBox="0 0 24 24">
          <rect x="5" y="3" width="14" height="14" rx="3" />
          <path d="M5 11h14M8 21l2-4M16 21l-2-4" />
          <circle cx="9" cy="14" r=".5" />
          <circle cx="15" cy="14" r=".5" />
        </symbol>
        <symbol id="i-pin" viewBox="0 0 24 24">
          <path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z" />
          <circle cx="12" cy="10" r="2.5" />
        </symbol>
        <symbol id="i-loc" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
          <circle cx="12" cy="12" r="7" />
        </symbol>
        <symbol id="i-share" viewBox="0 0 24 24">
          <path d="M12 15V3M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
        </symbol>
        <symbol id="i-star" viewBox="0 0 24 24">
          <path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.3l1.1-6.2L3 9.7l6.2-.9z" />
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </symbol>
        <symbol id="i-swap" viewBox="0 0 24 24">
          <path d="M7 4v16M3 8l4-4 4 4M17 20V4M21 16l-4 4-4-4" />
        </symbol>
        <symbol id="i-expand" viewBox="0 0 24 24">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
        </symbol>
        <symbol id="i-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"
          />
        </symbol>
        <symbol id="i-moon" viewBox="0 0 24 24">
          <path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z" />
        </symbol>
        <symbol id="i-auto" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="12" rx="2" />
          <path d="M8 20h8M12 16v4" />
        </symbol>
        <symbol id="i-venus" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="5" />
          <path d="M12 13v8M9 18h6" />
        </symbol>
      </defs>
    </svg>

    <header class="page">
      <h1>Cairo Metro: UI v2 mocks</h1>
      <p>
        Static mocks (no logic) of the "modern" ideas: a bottom sheet over a full-screen map, a
        route timeline, motion, skeleton loading, SVG icons and pills, plus a labelled map with a
        bold route highlight. Tell me what to keep, drop or change.
      </p>
    </header>
    <div class="bar">
      <span class="seg" id="theme" role="group" aria-label="Theme">
        <button data-t="light">
          <svg class="ico" style="width: 16px; height: 16px"><use href="#i-sun" /></svg>Light
        </button>
        <button data-t="dark">
          <svg class="ico" style="width: 16px; height: 16px"><use href="#i-moon" /></svg>Dark
        </button>
        <button data-t="auto" class="on">
          <svg class="ico" style="width: 16px; height: 16px"><use href="#i-auto" /></svg>Auto
        </button>
      </span>
      <span class="seg" id="dir" role="group" aria-label="Direction">
        <button data-d="ltr" class="on">LTR</button><button data-d="rtl">RTL</button>
      </span>
      <label>
        Route highlight
        <span class="sw" id="hl">
          <button
            data-c="#f59e0b"
            class="on"
            style="background: #f59e0b"
            aria-label="Amber"
          ></button>
          <button data-c="#8b5cf6" style="background: #8b5cf6" aria-label="Violet"></button>
          <button data-c="#ec4899" style="background: #ec4899" aria-label="Pink"></button>
          <button data-c="#06b6d4" style="background: #06b6d4" aria-label="Cyan"></button>
        </span>
      </label>
      <span class="seg" id="labels" role="group" aria-label="Map labels">
        <button data-l="key" class="on">Key labels</button><button data-l="all">All labels</button>
      </span>
      <button
        class="seg"
        style="
          border-radius: 999px;
          padding: 6px 14px;
          cursor: pointer;
          color: var(--text);
          font: inherit;
          font-size: 13px;
        "
        id="replay"
      >
        Replay motion
      </button>
    </div>

    <div class="row">
      <figure>
        <div class="phone" id="p1">
          <div class="mapbox">
            <svg
              class="map hasroute"
              id="m1"
              viewBox="0 0 330 644"
              preserveAspectRatio="xMidYMid slice"
            ></svg>
          </div>
          <div class="topcard">
            <div class="ep"><i></i>El-Monib <small>· Giza</small></div>
            <div class="ep to"><i></i>Maadi <small>· Line 1</small></div>
          </div>
          <div class="fab" style="top: 112px">
            <svg class="ico"><use href="#i-expand" /></svg>
          </div>
          <div class="fab" style="top: 160px">
            <svg class="ico"><use href="#i-loc" /></svg>
          </div>
          <div class="sheet" id="sheet" data-s="half">
            <button class="grab" id="grab" aria-label="Resize panel"><i></i></button>
            <div class="sbody">
              <div class="sum">
                <span class="big">24 min</span
                ><span class="pill" style="background: var(--accent)"><b>EGP</b>10</span>
              </div>
              <p class="meta">14 stations · 1 transfer · wait about 3 min</p>
              <div class="tags">
                <span class="tag ok"
                  ><svg class="ico" style="width: 14px; height: 14px"><use href="#i-clock" /></svg
                  >Open until 00:30</span
                >
                <span class="tag"
                  ><svg class="ico" style="width: 14px; height: 14px"><use href="#i-venus" /></svg
                  >Women-only cars</span
                >
              </div>
              <ol class="tl" id="tl1">
                <li style="--c: var(--l2)">
                  <b>El-Monib</b
                  ><small
                    >Board
                    <span class="pill" style="background: var(--l2)"
                      ><b>L2</b>towards Shubra El-Kheima</span
                    ></small
                  >
                </li>
                <li style="--c: var(--l2)">
                  <b>Sadat</b><small>Change to Line 1 · 4 min</small>
                  <details>
                    <summary>7 stops</summary>
                    <ul>
                      <li>Giza</li>
                      <li>Cairo University</li>
                      <li>Faisal</li>
                      <li>Dokki</li>
                      <li>Opera</li>
                      <li>Sadat</li>
                    </ul>
                  </details>
                </li>
                <li style="--c: var(--l1)">
                  <b>Maadi</b
                  ><small
                    >Get off
                    <span class="pill" style="background: var(--l1)"
                      ><b>L1</b>towards Helwan</span
                    ></small
                  >
                </li>
                <li class="walk" style="--c: var(--muted)">
                  <b>Walk to your place</b><small>650 m · 8 min</small>
                </li>
                <li style="--c: var(--accent)"><b>Maadi Grand Mall</b></li>
              </ol>
              <div class="cta">
                <button class="btn">
                  <svg class="ico"><use href="#i-share" /></svg>Share
                </button>
                <button class="btn p">
                  <svg class="ico"><use href="#i-star" /></svg>Save
                </button>
              </div>
            </div>
          </div>
        </div>
        <figcaption>
          <b>1. Bottom sheet + timeline.</b> Tap the grab handle to cycle peek / half / full. The
          map stays full-screen underneath; the route is highlighted on it.
        </figcaption>
      </figure>

      <figure>
        <div class="phone" id="p2">
          <div class="mapbox">
            <svg
              class="map hasroute"
              id="m2"
              viewBox="0 0 330 644"
              preserveAspectRatio="xMidYMid slice"
            ></svg>
          </div>
          <div class="fab" style="top: 12px">
            <svg class="ico"><use href="#i-expand" /></svg>
          </div>
          <div class="fab" style="top: 60px">
            <svg class="ico"><use href="#i-loc" /></svg>
          </div>
        </div>
        <figcaption>
          <b>2. Labelled map and route highlight.</b> Every station name sits beside its dot with a
          halo so it stays readable. The planned route gets a thick glowing highlight (pick the
          colour above), a white casing and moving dots; other lines fade back. Non-route labels
          dim. Key labels shows interchanges and route stations; All labels shows everything (the
          real map would hide labels by zoom level).
        </figcaption>
      </figure>

      <figure>
        <div class="phone" id="p3">
          <div class="appbar">
            <strong>Cairo Metro</strong><span class="tag">EN · العربية</span>
          </div>
          <div class="body">
            <div class="field on">
              <i class="ep" style="display: contents"
                ><i
                  style="width: 10px; height: 10px; border-radius: 50%; background: var(--accent)"
                ></i></i
              ><span style="flex: 1">sad|</span><svg class="ico"><use href="#i-loc" /></svg>
            </div>
            <div class="chips">
              <span class="chip on">All</span><span class="chip">Stations</span
              ><span class="chip">Places</span>
            </div>
            <div class="group" id="results">
              <h4>Metro stations</h4>
              <div class="item">
                <span class="ic" style="background: #2563eb"
                  ><svg class="ico"><use href="#i-train" /></svg></span
                ><span class="t"><b>Sadat</b><small>Tahrir Square · interchange</small></span
                ><span class="pill" style="background: var(--l1)"><b>L1</b></span>
                <span class="pill" style="background: var(--l2)"><b>L2</b></span>
              </div>
              <div class="item">
                <span class="ic" style="background: #2563eb"
                  ><svg class="ico"><use href="#i-train" /></svg></span
                ><span class="t"><b>Saad Zaghloul</b><small>Line 1</small></span
                ><span class="pill" style="background: var(--l1)"><b>L1</b></span>
              </div>
              <h4>Places near a station</h4>
              <div class="item">
                <span class="ic" style="background: #64748b"
                  ><svg class="ico"><use href="#i-pin" /></svg></span
                ><span class="t"
                  ><b>Sadat Museum</b><small>Nearest: Sakiat Mekky · 1.1 km</small></span
                >
              </div>
              <div class="skel"></div>
              <div class="skel" style="opacity: 0.6"></div>
            </div>
          </div>
          <div class="tabs">
            <div class="on">
              <svg class="ico"><use href="#i-pin" /></svg>Nearest station
            </div>
            <div>
              <svg class="ico"><use href="#i-train" /></svg>Trip planner
            </div>
          </div>
        </div>
        <figcaption>
          <b>3. Search, icons, motion.</b> SVG icons instead of emoji, line pills with codes, rows
          that slide in, a skeleton while results load, a glass header and tab bar, and a soft focus
          ring. Respects reduced-motion.
        </figcaption>
      </figure>
    </div>

    <script>
      const LINES = [
        {
          id: 'L2',
          c: 'var(--l2)',
          pts: [
            [30, 470],
            [70, 430],
            [110, 395],
            [150, 360],
            [190, 330],
            [225, 300],
            [260, 255],
            [285, 205],
          ],
        },
        {
          id: 'L1',
          c: 'var(--l1)',
          pts: [
            [200, 150],
            [215, 225],
            [225, 300],
            [235, 370],
            [250, 440],
            [270, 510],
            [290, 570],
          ],
        },
        {
          id: 'L3',
          c: 'var(--l3)',
          pts: [
            [40, 170],
            [130, 205],
            [215, 225],
            [260, 255],
            [300, 300],
          ],
        },
      ];
      const ST = [
        ['El-Monib', 30, 470, 'L2', 'r', 1],
        ['Giza', 70, 430, 'L2', 'l', 1],
        ['Cairo Univ.', 110, 395, 'L2', 'l', 1],
        ['Faisal', 150, 360, 'L2', 'l', 0],
        ['Dokki', 190, 330, 'L2', 'l', 1],
        ['Sadat', 225, 300, 'X', 'r', 1],
        ['Attaba', 260, 255, 'X', 'r', 0],
        ['Shubra', 285, 205, 'L2', 'r', 0],
        ['Ghamra', 200, 150, 'L1', 'r', 0],
        ['Nasser', 215, 225, 'X', 'l', 0],
        ['S. Zaghloul', 235, 370, 'L1', 'r', 0],
        ['Mar Girgis', 250, 440, 'L1', 'r', 0],
        ['Maadi', 270, 510, 'L1', 'r', 1],
        ['Helwan', 290, 570, 'L1', 'l', 0],
        ['Kit Kat', 40, 170, 'L3', 'r', 0],
        ['Zamalek', 130, 205, 'L3', 'l', 0],
        ['Abbassia', 300, 300, 'L3', 'l', 0],
      ];
      const ROUTE = [
        [
          [30, 470],
          [70, 430],
          [110, 395],
          [150, 360],
          [190, 330],
          [225, 300],
        ],
        [
          [225, 300],
          [235, 370],
          [250, 440],
          [270, 510],
        ],
      ];
      const ROUTE_NAMES = new Set([
        'El-Monib',
        'Giza',
        'Cairo Univ.',
        'Faisal',
        'Dokki',
        'Sadat',
        'S. Zaghloul',
        'Mar Girgis',
        'Maadi',
      ]);
      const path = (p) => 'M' + p.map((q) => q.join(',')).join(' L');
      function draw(svg, opts) {
        const lc = (n) => (n === 'X' ? 'var(--text)' : LINES.find((l) => l.id === n).c);
        let h = '<path class="river" d="M-10,420 C80,330 150,430 210,380 S300,300 350,330"/>';
        h +=
          '<path class="road" stroke-width="9" d="M0,260 C100,300 200,200 330,250"/><path class="road" stroke-width="6" d="M120,0 C150,200 100,400 160,644"/><path class="road" stroke-width="5" d="M0,560 L330,520"/>';
        LINES.forEach((l) => (h += `<path class="ln" stroke="${l.c}" d="${path(l.pts)}"/>`));
        if (opts.route) {
          ROUTE.forEach((r) => (h += `<path class="halo" d="${path(r)}"/>`));
          ROUTE.forEach((r) => (h += `<path class="case" d="${path(r)}"/>`));
          ROUTE.forEach(
            (r, i) =>
              (h += `<path class="rt" stroke="${i ? 'var(--l1)' : 'var(--l2)'}" d="${path(r)}"/>`),
          );
          ROUTE.forEach((r) => (h += `<path class="flow" d="${path(r)}"/>`));
        }
        ST.forEach(([n, x, y, ln, side, key]) => {
          const on = ROUTE_NAMES.has(n);
          const dim = opts.route && !on ? ' dim' : '';
          const show = opts.labels === 'all' || key || on || ln === 'X';
          h += `<g class="${dim}"><circle class="${ln === 'X' ? 'ix' : 'st'}" cx="${x}" cy="${y}" r="${ln === 'X' ? 6.5 : on ? 5.5 : 4.5}" ${ln === 'X' ? '' : `stroke="${lc(ln)}"`}/>`;
          if (show) {
            const dx = side === 'r' ? 11 : -11;
            h += `<text class="${on ? 'k' : ''}" x="${x + dx}" y="${y + 3.5}" text-anchor="${side === 'r' ? 'start' : 'end'}">${n}</text>`;
          }
          h += '</g>';
        });
        if (opts.route) {
          h +=
            '<g><circle cx="30" cy="470" r="9" fill="var(--accent)" stroke="#fff" stroke-width="3"/><path class="pin" d="M270,490 c-8,-10 -12,-14 -12,-20 a12,12 0 1 1 24,0 c0,6 -4,10 -12,20z"/><circle cx="270" cy="470" r="4" fill="#fff"/></g>';
        }
        svg.innerHTML = h;
      }
      const opts = { labels: 'key' };
      const render = () => {
        draw(document.getElementById('m1'), { route: true, labels: 'key' });
        draw(document.getElementById('m2'), { route: true, labels: opts.labels });
      };
      render();

      const root = document.documentElement;
      const mq = matchMedia('(prefers-color-scheme: dark)');
      const setTheme = (t) => {
        root.dataset.theme = t === 'auto' ? (mq.matches ? 'dark' : 'light') : t;
        document
          .querySelectorAll('#theme button')
          .forEach((b) => b.classList.toggle('on', b.dataset.t === t));
        window.__t = t;
      };
      mq.addEventListener('change', () => window.__t === 'auto' && setTheme('auto'));
      setTheme('auto');
      document
        .querySelectorAll('#theme button')
        .forEach((b) => (b.onclick = () => setTheme(b.dataset.t)));
      document.querySelectorAll('#dir button').forEach(
        (b) =>
          (b.onclick = () => {
            root.dir = b.dataset.d;
            document
              .querySelectorAll('#dir button')
              .forEach((x) => x.classList.toggle('on', x === b));
          }),
      );
      document.querySelectorAll('#hl button').forEach(
        (b) =>
          (b.onclick = () => {
            root.style.setProperty('--hl', b.dataset.c);
            document
              .querySelectorAll('#hl button')
              .forEach((x) => x.classList.toggle('on', x === b));
          }),
      );
      document.querySelectorAll('#labels button').forEach(
        (b) =>
          (b.onclick = () => {
            opts.labels = b.dataset.l;
            document
              .querySelectorAll('#labels button')
              .forEach((x) => x.classList.toggle('on', x === b));
            render();
          }),
      );
      const order = ['peek', 'half', 'full'];
      document.getElementById('grab').onclick = () => {
        const s = document.getElementById('sheet');
        s.dataset.s = order[(order.indexOf(s.dataset.s) + 1) % 3];
      };
      document.getElementById('replay').onclick = () => {
        ['tl1', 'results'].forEach((id) => {
          const el = document.getElementById(id);
          el.style.animation = 'none';
          el.querySelectorAll('li, .item').forEach((n) => {
            n.style.animation = 'none';
            void n.offsetWidth;
            n.style.animation = '';
          });
        });
      };
    </script>
  </body>
</html>
